version: "2.0"
name: parent_error_recovery
description: Parent calls failing child, catches on-error, recovers, continues

tasks:
  attempt:
    workflow: failing_child
    on-error:
      - recovery

  recovery:
    action: std.echo
    input:
      output: "recovered-from-child-failure"
    on-success:
      - continue_after_recovery

  continue_after_recovery:
    action: std.echo
    input:
      output: "carrying-on-regardless"

output:
  status: "recovered"
