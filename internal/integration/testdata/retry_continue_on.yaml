version: "2.0"
name: retry_continue_on
description: "continue-on keeps retrying after SUCCESS until count runs out"

tasks:
  loop_task:
    action: std.echo
    retry:
      count: 3
      delay: 0
      continue-on: <% true %>
    input:
      output: "loop-attempt"
    on-success:
      - next

  next:
    action: std.echo
    input:
      output: "after-loop"

output:
  loop_done: "<% task('loop_task').result %>"
  next_done: "<% task('next').result %>"
