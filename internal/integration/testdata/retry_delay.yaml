version: "2.0"
name: retry_delay_demo
description: retry with delay=2s — each attempt delayed before creation.

tasks:
  flaky:
    action: std.echo
    input:
      output: "always-fails"
    policies:
      retry:
        count: 2
        delay: 2
    on-error:
      - recovered

  recovered:
    action: std.echo
    input:
      output: "retry-exhausted-after-delay"
