---
version: "2.0"

name: nested_reverse

workflows:
  wf1:
    type: reverse
    input:
      - param1
      - param2
    output:
      final_result: "<% $.final_result %>"

    tasks:
      # Reverse start task (no requires)
      task1:
        action: std.echo
        input:
          output: "<% $.param1 %>"
        publish:
          result1: "<% task(task1).result %>"

      # This one depends on task1 — so reverse runs task1 first, then task2
      task2:
        action: std.echo
        input:
          output: "<% $.param1 %> & <% $.param2 %>"
        publish:
          final_result: "<% task(task2).result %>"
        requires: [task1]

  wf2:
    type: direct
    output:
      slogan: "<% $.slogan %>"

    tasks:
      task1:
        # Go adapts Python's `workflow: wf1 param1='Bonnie' param2='Clyde'`
        # into explicit input: dict (Go doesn't support inline workflow args).
        workflow: wf1
        input:
          param1: "Bonnie"
          param2: "Clyde"
        publish:
          slogan: "<% task(task1).result.final_result %> is a cool movie!"
