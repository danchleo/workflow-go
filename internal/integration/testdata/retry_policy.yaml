version: "2.0"
name: retry_demo
description: flaky task that fails twice then succeeds on 3rd attempt via retry policy

tasks:
  flaky:
    action: std.echo
    input:
      output: "flaky-output"
    policies:
      retry:
        count: 2
        delay: 0
    on-success:
      - done

  done:
    action: std.echo
    input:
      output: "flaky-finally-worked"
